<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="waterGrad" x1="50" y1="10" x2="50" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="shineGrad" x1="40" y1="20" x2="45" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <filter id="shadow" x="15" y="10" width="70" height="85" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0369a1" flood-opacity="0.25" />
    </filter>
  </defs>
  
  <!-- Outer Water Droplet with Drop Shadow -->
  <path d="M50 12 C50 12, 22 50, 22 68 C22 83.464 34.536 96 50 96 C65.464 96 78 83.464 78 68 C78 50, 50 12, 50 12 Z" 
        fill="url(#waterGrad)" 
        filter="url(#shadow)" />
        
  <!-- Subtle Internal Reflection/Shine -->
  <path d="M50 18 C50 18, 30 52, 30 68 C30 76 34 82 40 86 C32 80 28 72 28 66 C28 52 50 22 50 18 Z" 
        fill="url(#shineGrad)" />
        
  <!-- Modern Geometric Ripples Inside -->
  <path d="M38 72 C43 68, 57 68, 62 72" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-opacity="0.9" />
  <path d="M43 78 C46 75, 54 75, 57 78" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.75" />
</svg>
